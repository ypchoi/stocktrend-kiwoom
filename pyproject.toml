[project]
name = "stocktrend-kiwoom"
version = "0.1.0"
description = "Stocktrend Kiwoom Service"
authors = [
    {name = "Author", email = "author@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.110.0)",
    "uvicorn[standard] (>=0.29.0)",
    "redis (>=5.0.3)",
    "httpx (>=0.28.0)",
    "pydantic-settings (>=2.2.1)",
    "stocktrend-core"
]

[tool.poetry]
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
stocktrend-core = { path = "../stocktrend-core", develop = true }

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.0.0)",
    "pytest-asyncio (>=0.23.0)",
    "ruff (>=0.9.0)"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
